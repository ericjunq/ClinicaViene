services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vienenclinica
      POSTGRES_USER: vienenclinica
      POSTGRES_PASSWORD: vienenclinica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vienenclinica -d vienenclinica"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vienenclinica
      SPRING_DATASOURCE_USERNAME: vienenclinica
      SPRING_DATASOURCE_PASSWORD: vienenclinica
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
