spring:
  application:
    name: VieneClinica

  datasource:
    url: jdbc:mysql://localhost:3306/viene_clinica
    username: root
    password: sua_senha
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret-key: ${SECRET_KEY}
  access-token-expires: ${ACCESS_TOKEN_EXPIRES}
  refresh-token-expires: ${REFRESH_TOKEN_EXPIRES}

server:
  port: 8080