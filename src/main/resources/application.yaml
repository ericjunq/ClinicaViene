spring:
  application:
    name: VieneClinica

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vienenclinica}
    username: ${SPRING_DATASOURCE_USERNAME:vienenclinica}
    password: ${SPRING_DATASOURCE_PASSWORD:vienenclinica}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        
  server:
    port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 min default
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 dias default

