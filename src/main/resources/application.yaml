spring:
  application:
    name: VieneClinica

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vienenclinica}
    username: ${SPRING_DATASOURCE_USERNAME:vienenclinica}
    password: ${SPRING_DATASOURCE_PASSWORD:vienenclinica}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        
  server:
    port: 8080

jwt:
  secret_key: ${JWT_SECRET_KEY}
  access_token_expires: ${JWT_ACCESS_TOKEN_EXPIRES}
  refresh_token_expires: ${JWT_REFRESH_TOKEN_EXPIRES}

